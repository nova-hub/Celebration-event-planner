<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celebration Planner | Event, Budget & Guest Hub</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ec4899'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>">
  
  <!-- Tailwind CSS CDN for utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#08070b',
            celebration: {
              purple: '#a855f7',
              pink: '#ec4899',
              softPink: '#f472b6'
            }
          }
        }
      }
    }
  </script>

  <!-- Canvas Confetti for celebratory animations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#08070b] text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-purple-500/30 selection:text-pink-300">

  <!-- Sticky Navbar -->
  <header class="sticky top-0 z-40 border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20 gap-4">
        <!-- Logo -->
        <div onclick="App.navigate('dashboard')" class="flex items-center gap-3 cursor-pointer shrink-0 select-none group">
          <div class="p-2.5 rounded-2xl bg-gradient-to-tr from-purple-600 via-pink-500 to-purple-400 text-white shadow-lg shadow-purple-600/30 group-hover:scale-105 transition-transform text-lg">
            ✨
          </div>
          <div>
            <div class="flex items-center gap-1.5 font-extrabold text-base sm:text-lg tracking-tight text-white">
              <span>CELEBRATION</span>
              <span class="text-gradient">HUB</span>
            </div>
            <p class="text-[10px] text-zinc-400 tracking-wider uppercase font-semibold">
              Event, Budget & Guest Planner
            </p>
          </div>
        </div>

        <!-- Desktop Navigation Tabs -->
        <nav class="hidden md:flex items-center gap-1 bg-zinc-900/60 p-1.5 rounded-2xl border border-zinc-800/80">
          <button data-nav="dashboard" onclick="App.navigate('dashboard')" class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-md cursor-pointer">
            <span>📊 Dashboard</span>
          </button>
          <button data-nav="calendar" onclick="App.navigate('calendar')" class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-white hover:bg-zinc-800 cursor-pointer">
            <span>📅 Calendar</span>
          </button>
          <button data-nav="events" onclick="App.navigate('events')" class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-white hover:bg-zinc-800 cursor-pointer">
            <span>🎉 All Celebrations</span>
          </button>
        </nav>

        <!-- Search Input -->
        <div class="hidden lg:block relative max-w-xs w-full">
          <input
            type="text"
            id="search-input"
            placeholder="Search celebrations, venues..."
            class="glass-input text-xs pl-8"
          />
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-500 text-xs">🔍</span>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 sm:gap-2.5">
          <!-- Export Data JSON -->
          <a
            href="/api/stats/export"
            target="_blank"
            title="Download persistent JSON database backup"
            class="hidden sm:flex items-center justify-center p-2.5 rounded-xl text-zinc-400 hover:text-white bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 transition-colors text-sm"
          >
            💾
          </a>

          <!-- Reset / Seed Demo Celebrations -->
          <button
            onclick="App.resetSeed()"
            title="Reload realistic celebrations (Birthdays, Weddings, Anniversaries, Parties)"
            class="hidden sm:flex items-center justify-center p-2.5 rounded-xl text-zinc-400 hover:text-purple-300 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 transition-colors text-sm cursor-pointer"
          >
            🔄
          </button>

          <!-- Primary Add Event Button -->
          <button
            onclick="App.openEventModal()"
            class="gradient-btn flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs font-bold cursor-pointer transition-transform hover:scale-105 active:scale-95"
          >
            <span>+</span>
            <span>New Celebration</span>
          </button>
        </div>
      </div>

      <!-- Mobile Navigation Row -->
      <div class="flex md:hidden items-center justify-around py-2.5 border-t border-zinc-850 text-xs">
        <button onclick="App.navigate('dashboard')" class="text-zinc-300 hover:text-white font-semibold">📊 Dashboard</button>
        <button onclick="App.navigate('calendar')" class="text-zinc-300 hover:text-white font-semibold">📅 Calendar</button>
        <button onclick="App.navigate('events')" class="text-zinc-300 hover:text-white font-semibold">🎉 All Events</button>
        <button onclick="App.resetSeed()" class="text-purple-400 font-semibold">🔄 Reset Demo</button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="app-content">
      <!-- Injected dynamically by app.js -->
      <div class="text-center py-20 text-zinc-500">
        <p class="text-sm font-semibold">Loading celebration hub...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-900 bg-zinc-950/70 py-6 text-center text-xs text-zinc-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="font-bold text-zinc-300">Celebration Event Planner</span>
        <span>•</span>
        <span class="text-purple-400">🎂 Birthday • 💍 Wedding • 🥂 Anniversary • 🎉 Party</span>
      </div>
      <div class="text-zinc-500 text-[11px]">
        Full-stack persistent architecture • Node.js, Express & JSON Database
      </div>
    </div>
  </footer>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-auto"></div>

  <!-- Client Application Engine -->
  <script src="/js/app.js"></script>
</body>
</html>
